<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Software Dev Starter</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Modern Software Dev Starter (Week 7)</h1>

      <section>
        <h2>📝 Notes</h2>
        <form id="note-form">
          <label for="note-title" class="sr-only">Title</label>
          <input id="note-title" placeholder="Title" aria-label="Note title" required />
          <label for="note-content" class="sr-only">Content</label>
          <input id="note-content" placeholder="Content" aria-label="Note content" required />
          <button type="submit">Add Note</button>
        </form>
        <div style="margin:.25rem 0;">
          <input id="note-search" placeholder="Search notes..." />
          <button id="note-search-btn">Search</button>
          <button id="clear-note-search">Clear</button>
        </div>
        <ul id="notes"></ul>
      </section>

      <section>
        <h2>✅ Action Items</h2>
        <form id="action-form">
          <input id="action-desc" placeholder="Description" required />
          <button type="submit">Add Action Item</button>
        </form>
        <div style="margin:.25rem 0;">
          <label><input type="checkbox" id="filter-completed" /> Show completed only</label>
        </div>
        <ul id="actions"></ul>
      </section>

      <!-- Tags Section (Task 3) -->
      <section id="tags-section">
        <h2>🏷️ Tags</h2>
        <form id="tag-form">
          <input id="tag-name" placeholder="Tag name" required />
          <input id="tag-color" type="color" value="#3498db" title="Tag color" />
          <button type="submit">Add Tag</button>
        </form>
        <ul id="tags"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
